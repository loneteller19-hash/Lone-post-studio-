name: Build APK
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: |
          mkdir apkbuild && cp capacitor.config.json apkbuild/ && cp -r www apkbuild/ && cp -r public/icons apkbuild/icons
          cd apkbuild
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          printf "\nconfigurations.all {\n    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n}\n" >> android/app/build.gradle
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do for f in ic_launcher ic_launcher_round ic_launcher_foreground; do cp icons/icon-192.png android/app/src/main/res/mipmap-$d/$f.png; done; done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Lone-Post-Studio-APK
          path: apkbuild/android/app/build/outputs/apk/debug/app-debug.apk
