<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lone Post Studio</title>
<style>
:root{--bg:#f6f5f9;--c:#fff;--tx:#1d1b26;--m:#6b6880;--b:#e3e0ee;--a:#6c4cf1}
@media(prefers-color-scheme:dark){:root{--bg:#13121a;--c:#1d1b27;--tx:#f1eff8;--m:#a09cb8;--b:#322f42;--a:#8d73ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:16px}.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.col{border:1px solid var(--b);border-radius:12px;padding:12px}
input,textarea{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button,.btn{display:inline-block;padding:10px 14px;border:0;border-radius:10px;background:var(--a);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.ok{color:#1a9d5c}.no{color:#d33}.m{color:var(--m);font-size:13px}label{font-size:13px;color:var(--m)}
</style></head><body><main>
<h1>🎬 Lone Post Studio</h1>
<form id="f" class="card">
<label>Video file</label><input type="file" name="video" accept="video/*" required>
<label>Title</label><input name="title" maxlength="100" required>
<label>Description</label><textarea name="description" rows="4"></textarea>
<label>Schedule (leave empty to post now)</label><input type="datetime-local" name="scheduleAt">
<div class="cols">
<div class="col"><b>▶ YouTube</b><div id="ys" class="m">Checking…</div>
<label><input type="checkbox" id="py" style="width:auto"> Post to YouTube</label><br>
<label><input type="checkbox" id="sh" style="width:auto"> Upload as Short (≤60s, vertical)</label></div>
<div class="col"><b>📸 Instagram</b><div id="is" class="m">Checking…</div>
<label><input type="checkbox" id="pi" style="width:auto"> Post as Reel</label></div>
</div><br><button>Post / Schedule</button> <span id="msg" class="m"></span>
</form>
<div class="card"><b>Queue &amp; results</b><div id="jobs"></div></div>
</main><script>
const $=i=>document.getElementById(i);
async function load(){
 const s=await (await fetch("/api/status")).json();
 $("ys").innerHTML=s.youtube?'<span class="ok">Connected</span>':'<a class="btn" href="/auth/google">Sign in with Google</a>';
 $("is").innerHTML=s.instagram?'<span class="ok">Token set</span>':'<span class="no">Add IG_USER_ID and IG_ACCESS_TOKEN in .env</span>';
 $("py").disabled=!s.youtube;$("pi").disabled=!s.instagram;
 $("jobs").innerHTML=s.jobs.slice().reverse().map(j=>`<p><b></b><br><span class="m">${j.state} · ${new Date(j.at).toLocaleString()}</span><br>${
  Object.entries(j.results).map(([p,r])=>`<span class="${r.ok?"ok":"no"}">${p}: ${r.msg}</span>`).join("<br>")}</p>`).join("")||'<p class="m">Nothing yet.</p>';
 [...$("jobs").querySelectorAll("b")].forEach((e,i)=>e.textContent=s.jobs.slice().reverse()[i].title);
}
$("f").onsubmit=async e=>{e.preventDefault();
 const p=[];if($("py").checked)p.push("youtube");if($("pi").checked)p.push("instagram");
 if(!p.length){$("msg").textContent="Pick a platform";return}
 const d=new FormData($("f"));d.append("platforms",JSON.stringify(p));d.append("short",$("sh").checked);
 $("msg").textContent="Uploading to server…";
 const r=await(await fetch("/api/post",{method:"POST",body:d})).json();
 $("msg").textContent=r.ok?"Queued ✓":r.error;load();};
load();setInterval(load,10000);
</script></body></html>
